name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # GÖREV 1: TESTLERİ ÇALIŞTIR
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
        
    - name: Run Tests
      # Dummy API key veriyoruz ki settings.validate() patlamasın.
      # Testlerde mock kullandığımız için gerçek key'e ihtiyaç yok.
      env:
        GOOGLE_API_KEY: "dummy_ci_key_for_testing"
        GEMINI_MODEL: "models/gemini-2.0-flash"
      run: |
        pytest tests/ -v

  # GÖREV 2: DOCKER BUILD KONTROLÜ
  docker-build:
    needs: test  # Testler geçerse buraya gel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker Image
      run: docker build . --file Dockerfile --tag calculator-agent:latest